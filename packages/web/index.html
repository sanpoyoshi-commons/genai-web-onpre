<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&display=swap"

    <!--
      Runtime config (on-premise). nginx が .env の MODEL_IDS から実行時生成する
      classic blocking script。module バンドルより前に window.__APP_CONFIG__ を
      同期セットし、models.ts がモデル一覧を実行時に読む（build 時焼き込み不要）。
      未配信（dev / 生成前）でも 404 は無害＝models.ts は build 時 env にフォールバック。
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
