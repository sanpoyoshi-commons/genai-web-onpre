# OSV-Scanner ベースライン（genai-web-onpre）
#
# 方針: monorepo root の package-lock.json を scan すると、配信対象の packages/web と
# 上流参考由来の非配信依存（AWS SDK / @aws-crypto）が混在計上される。以下は
# 「上流参考依存のみに存在し、配信web には到達しない」脆弱性。
# 切り分け根拠: `npm ls <pkg> -w packages/web` で web 到達 0 を確認済（2026-06-10）。
#
# ignoreUntil で再評価を強制する（恒久 ignore にしない）。期限到来時は再 scan し、
# 上流参考依存（AWS SDK / @aws-crypto）の更新有無と web 非到達を再確認すること。
# 配信web側の脆弱性（react-router/mermaid/postcss/uuid）は 2026-06-10 に修正済み。

[[IgnoredVulns]]
id = "GHSA-q3j6-qgpj-74h6"
ignoreUntil = 2026-09-10
reason = "fast-uri@3.1.0 (path traversal). 上流参考依存（AWS SDK）由来のみ。配信web 非到達。"

