# --- 非ランタイム（dev/build/test）の undici / vite は 2026-07-03 に実バンプで解消し allowlist から除去。
# runtime 到達分（dompurify）は別途 3.4.11 へバンプ済。
#   - vite 8.0.8 → 8.0.16（root overrides で固定）＝CVE-2026-53571/GHSA-fx2h-pf6j-xcff・GHSA-v6wh-96g9-6wx3 解消。
#   - undici 7.24.7 → 7.28.0（root overrides で jsdom 経由の推移依存を固定）＝CVE-2026-12151 他 7 GHSA 解消。
# ＝これらは ignoreUntil ではなく「修正済み」。除去により将来の undici/vite 脆弱性が allowlist で隠れないようにする。
# 残る fast-uri / fast-xml-builder / fast-xml-parser（上の 2026-09-10 分）は上流参考依存（AWS SDK）・
# @aws-sdk Bedrock 残渣で配信web 非到達のため ignoreUntil を継続（AWS 残渣の死依存整理で再評価）。
