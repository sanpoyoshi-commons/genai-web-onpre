# ---------------------------------------------------------------------------
# 配信 web に同梱されるが、発火の前提が構成上成立しない
# 判定: 該当（監視のみ・確定）。到達性ではなく発火条件で切っている。
#
# dompurify は mermaid 11.16.1 経由の推移依存で、配信バンドルには入る。発火には sanitize の
# IN_PLACE 指定が必須で、mermaid 11.16.1 に IN_PLACE は 0 件、hook 2 件はいずれも要素を削除
# しない。packages/web 側にも IN_PLACE・addHook・dompurifyConfig は 0 件（2026-10-02 実測）。
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-p98j-92pf-mc4p"
ignoreUntil = 2026-10-17
reason = "dompurify@3.4.13 (IN_PLACE: node-removing afterSanitize hook leaves detached subtree event handlers armed). 該当（監視のみ・確定＝発火前提が構成上不成立）。affected >=3.4.13 <=3.4.15。mermaid 11.16.1 経由の推移で配信バンドルに同梱されるが、発火には sanitize の IN_PLACE 指定が必須で、mermaid 11.16.1 に IN_PLACE 0件・hook 2件とも要素を削除せず、packages/web 側にも IN_PLACE・addHook・dompurifyConfig は0件（2026-10-02 実測）。修正版 3.4.16。2026-10-03 に判定を確認し直した。同時に公開された GHSA-6688-9rhm-gjv2（affected <=3.4.15・修正版も 3.4.16）は scan に出ないため登録しない（検出されない ID を登録すると、使われない除外が残るため）。"
