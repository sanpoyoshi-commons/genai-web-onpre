# OSV-Scanner ベースライン（genai-web-onpre）
#
# 方針: monorepo root の package-lock.json を scan する。ここに載せるのは「配信 web に到達しない」
# または「dev / build / test でしか使わない」脆弱性だけで、ID 単位・期限つき（ignoreUntil）で登録する。
# パッケージ単位の除外と、期限なしの登録はしない。配信 web に届くものは、登録ではなく実際に版を
# 上げて解消する。
#
# 切り分けの根拠（2026-09-23 実測）:
#   - 到達性は `npm ls <パッケージ名> -w packages/web` で測った。
#   - 配信バンドル `packages/web/dist` を直接走査し、該当ライブラリの同梱を 0 件と確認した。
#   - リポジトリ自身のコード（node_modules を除く全文）からの直接呼び出しも 0 件と確認した。
#
# 配信 web に到達していた 2 件は、登録ではなく実際に版を上げて解消した（2026-09-23）:
#   - dompurify 3.4.11 → 3.4.13（mermaid 経由で配信バンドルに同梱。修正版 3.4.13 以上）
#   - react-router 7.17.0 → 7.18.2（packages/web の直接依存。修正版 7.18.2）
# 以前の版（undici・vite）と同じく、版を上げて消えたものは本ファイルに残さない。
#
# 2026-09-26 に、当時の 8 件を登録し直した（期限の延長ではなく、判定を確認し直したうえでの再登録。
# 期限は登録日 +2 週間）。期限が来たら再 scan し、判定と配信非到達を必ず確認し直すこと。
#
# 2026-10-03 に、以下の 9 件を登録し直した（同じく延長ではなく、判定を確認し直したうえでの再登録。
# 期限は登録日 +2 週間 = 2026-10-17）:
#   - 既存の 8 件は、判定が「該当（監視のみ）」から変わっていないことを、GHSA と CVE の両方の
#     採番で確認し直した（格上げ無し）。
#   - dompurify の 1 件を新しく登録した。2026-10-03 の scan で初めて出たもので、判定は確定して
#     いる（下のブロック）。同時に公開されたもう 1 件は scan に出ないため登録しない。
#
# 2026-10-10 に、登録を 9 件から 1 件へ減らした。8 件は実際に版を上げて消えたので削除した
# （版を上げて消えたものは本ファイルに残さない。undici・vite・dompurify・react-router と同じ扱い）:
#   - dompurify 3.4.13 → 3.4.16（GHSA-p98j-92pf-mc4p ／ GHSA-6688-9rhm-gjv2 の 2 件を同時に解消）
#   - postcss 8.5.10 → 8.5.28（GHSA-6g55-p6wh-862q ／ GHSA-r28c-9q8g-f849 ／ GHSA-fxqj-rqcc-2cmp）
#   - nanoid 3.3.15 → 3.3.19（GHSA-28wg-ghj8-5hjv ／ GHSA-2v37-7h3g-55p8）
#   - source-map-js 1.2.1 → 1.2.2（GHSA-68fv-2mgg-jv7q。登録はしていなかった）
#   - vitest / @vitest/mocker 4.1.4 → 4.1.11（GHSA-82fw-gwwq-j7x9）
#   - @aws-sdk の 3 client 3.1029.0 → 3.1146.0 で fast-xml-parser と fast-xml-builder が lock から
#     消えた（GHSA-gh4j-gqv2-49f6 ／ GHSA-5wm8-gmm8-39j9）。新しい @aws-sdk/xml-builder 3.972.41 は
#     fast-xml-parser に依存しない。上げる途中で fast-xml-builder 1.1.5 を経由していないことも
#     確認した（GHSA-45c6-75p6-83cc は `=1.1.5` ちょうどが affected）。
# dompurify と postcss は root の overrides が版を固定していたため、lock だけでは動かなかった。
# この 2 つは overrides の値も同時に上げた（ほかの overrides と各 package.json の範囲は触っていない）。
#
# 2026-10-03 の版に「GHSA-6688-9rhm-gjv2 は走査で検出されないため登録しない」と書いていたが、
# 2026-10-10 の走査では検出された。いずれにせよ dompurify 3.4.16 で解消したため、登録はしない。
#
# 残る 1 件は katex で、配信バンドルに同梱されるが上げ先が依存の範囲外にある（下のブロック）。

# ---------------------------------------------------------------------------
# 配信バンドルに同梱されるが、上げ先が依存の範囲外にある
#
# katex は mermaid 経由の推移依存で、配信バンドルに入る（`packages/web/dist/assets/katex-*.js`）。
# 修正版 0.18.2 は mermaid が許す範囲の外にあり、mermaid は 11.16.1（現行）・11.17.2・12.1.0（最新）の
# いずれも katex を `^0.16.x` で引くため、mermaid を上げても 0.18 には到達しない。overrides で
# 0.18 を強制すると mermaid の数式の描画を壊すおそれがあるため、強制はしない。
#
# 判定は暫定である（確定ではない）。未確認が 2 点ある:
#   1. ページの中で先に起きる prototype 汚染の経路（この発火の前提）が、この構成で成立しうるか
#   2. mermaid が katex の出力をどこまで無害化しているか
# 重大度は low（CVSS 2.1 / 4.7 MED）で、発火には別の原因による prototype 汚染が先に要る。
# 配信 web に届くものを登録するのは方針の例外であり、2026-10-10 の判断による。
# 期限の日に、mermaid の新しい版が katex 0.18 を許すようになったかを確かめ直す。
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-10-24
reason = "katex@0.16.47 / CVE-2026-103923 (Existing prototype pollution can bypass trust restrictions). 該当（監視のみ・暫定）。affected >=0.11.0 <=0.18.1・2.1 LOW / 4.7 MED・CWE-807/79・2026-10-01 公開。mermaid 経由の推移依存で配信バンドルに同梱される（packages/web/dist/assets/katex-*.js）。発火には別の原因による prototype 汚染が先に起きていることが要る。未確認が 2 点ある: (1) その汚染の経路がこの構成で成立しうるか (2) mermaid が katex の出力をどこまで無害化しているか。したがって「確定」ではない。remedy＝0.18.2 だが mermaid の許す範囲の外（11.16.1 は ^0.16.45、11.17.2 と 12.1.0 は ^0.16.47）で、overrides での強制は mermaid の数式の描画を壊すおそれがあるため採らない。配信 web に届くものの登録は方針の例外で、2026-10-10 の判断による。期限の日に mermaid の新しい版が katex 0.18 を許すかを確かめ直す。"
