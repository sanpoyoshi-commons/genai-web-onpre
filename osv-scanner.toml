# OSV-Scanner ベースライン（genai-web-onpre）
#
# 方針: monorepo root の package-lock.json を scan する。ここに載せるのは「配信 web に到達しない」
# または「dev / build / test でしか使わない」脆弱性だけで、ID 単位・期限つき（ignoreUntil）で登録する。
# パッケージ単位の除外と、期限なしの登録はしない。配信 web に届くものは、登録ではなく実際に版を
# 上げて解消する。
#
# 切り分けの根拠（2026-09-23 実測）:
#   - 到達性は `npm ls <パッケージ名> -w packages/web` で測った。
#   - 配信バンドル `packages/web/dist` を直接走査し、該当ライブラリの同梱を 0 件と確認した。
#   - リポジトリ自身のコード（node_modules を除く全文）からの直接呼び出しも 0 件と確認した。
#
# 配信 web に到達していた 2 件は、登録ではなく実際に版を上げて解消した（2026-09-23）:
#   - dompurify 3.4.11 → 3.4.13（mermaid 経由で配信バンドルに同梱。修正版 3.4.13 以上）
#   - react-router 7.17.0 → 7.18.2（packages/web の直接依存。修正版 7.18.2）
# 以前の版（undici・vite）と同じく、版を上げて消えたものは本ファイルに残さない。
#
# 2026-09-26 に、当時の 8 件を登録し直した（期限の延長ではなく、判定を確認し直したうえでの再登録。
# 期限は登録日 +2 週間）。期限が来たら再 scan し、判定と配信非到達を必ず確認し直すこと。
#
# 2026-10-03 に、以下の 9 件を登録し直した（同じく延長ではなく、判定を確認し直したうえでの再登録。
# 期限は登録日 +2 週間 = 2026-10-17）:
#   - 既存の 8 件は、判定が「該当（監視のみ）」から変わっていないことを、GHSA と CVE の両方の
#     採番で確認し直した（格上げ無し）。
#   - dompurify の 1 件を新しく登録した。2026-10-03 の scan で初めて出たもので、判定は確定して
#     いる（下のブロック）。同時に公開されたもう 1 件は scan に出ないため登録しない。

# ---------------------------------------------------------------------------
# packages/types が持つ @aws-sdk 経由（配信 web からは届かない）
# 判定: 該当（監視のみ・攻撃面クローズ）。配信バンドルに 0 件、リポジトリ自身のコードからの
# 呼び出しも 0 件。
#
# 依存の経路（2026-09-26 に `npm ls` で実測）:
#   packages/types -> @aws-sdk/client-bedrock-agent-runtime@3.1029.0 -> @aws-sdk/core@3.973.27
#   -> @aws-sdk/xml-builder@3.972.17 -> fast-xml-parser@5.5.8 -> fast-xml-builder@1.1.4
# 配信 web（packages/web）は packages/types に依存していない（依存は npm の @types/* だけ）。
#
# 解消の手段（2026-10-03 実測）: ワークスペース配下の推移依存には、root の overrides に上げ先を
# 書いても効かない。npm が既存の package-lock.json を再解決しないため、lock の版が動かない
# （npm/cli#4834）。この 2 件を消すには親の @aws-sdk の更新が要る（新しい @aws-sdk/xml-builder は
# fast-xml-parser に依存しない）。別の変更で扱う。
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-5wm8-gmm8-39j9"
ignoreUntil = 2026-10-17
reason = "fast-xml-builder@1.1.4 (attribute bypass). 該当（監視のみ・攻撃面クローズ）。affected <=1.1.6。packages/types の @aws-sdk 経由（client-bedrock-agent-runtime <- @aws-sdk/core <- @aws-sdk/xml-builder <- fast-xml-parser）でのみ入る。@aws-sdk は packages/types の型定義でしか参照されず、実行時の import は 0 件。経路は 2026-09-26 に npm ls で実測、配信バンドル0件・直接呼び出し0件は 2026-09-23 実測。修正版 1.1.7 以上。2026-10-03 に判定を確認し直した（GHSA・CVE の両方の採番で突合。判定・修正版に変化なし）。"

[[IgnoredVulns]]
id = "GHSA-gh4j-gqv2-49f6"
ignoreUntil = 2026-10-17
reason = "fast-xml-parser@5.5.8 (comment/CDATA injection). 該当（監視のみ・攻撃面クローズ）。affected <5.7.0。packages/types の @aws-sdk 経由（client-bedrock-agent-runtime <- @aws-sdk/core <- @aws-sdk/xml-builder）でのみ入る（@aws-sdk/xml-builder 3.972.17 が 5.5.8 を版固定で引く）。実行時の import は 0 件。経路は 2026-09-26 に npm ls で実測、配信バンドル0件・直接呼び出し0件は 2026-09-23 実測。修正版 5.7.0 以上（@aws-sdk 側は 3.1038.0 以上）。2026-10-03 に判定を確認し直した（GHSA・CVE の両方の採番で突合。判定・修正版に変化なし）。"

