# OSV-Scanner ベースライン（genai-web-onpre）
#
# 方針: monorepo root の package-lock.json を scan する。ここに載せるのは「配信 web に到達しない」
# または「dev / build / test でしか使わない」脆弱性だけで、ID 単位・期限つき（ignoreUntil）で登録する。
# パッケージ単位の除外と、期限なしの登録はしない。配信 web に届くものは、登録ではなく実際に版を
# 上げて解消する。
#
# 切り分けの根拠（2026-09-23 実測）:
#   - 到達性は `npm ls <パッケージ名> -w packages/web` で測った。
#   - 配信バンドル `packages/web/dist` を直接走査し、該当ライブラリの同梱を 0 件と確認した。
#   - リポジトリ自身のコード（node_modules を除く全文）からの直接呼び出しも 0 件と確認した。
#
# 配信 web に到達していた 2 件は、登録ではなく実際に版を上げて解消した（2026-09-23）:
#   - dompurify 3.4.11 → 3.4.13（mermaid 経由で配信バンドルに同梱。修正版 3.4.13 以上）
#   - react-router 7.17.0 → 7.18.2（packages/web の直接依存。修正版 7.18.2）
# 以前の版（undici・vite）と同じく、版を上げて消えたものは本ファイルに残さない。
#
# 2026-09-26 に、以下の 8 件を登録し直した（期限の延長ではなく、判定を確認し直したうえでの再登録。
# 期限は登録日 +2 週間）。期限が来たら再 scan し、判定と配信非到達を必ず確認し直すこと。

# ---------------------------------------------------------------------------
# packages/types が持つ @aws-sdk 経由（配信 web からは届かない）
# 判定: 該当（監視のみ・攻撃面クローズ）。配信バンドルに 0 件、リポジトリ自身のコードからの
# 呼び出しも 0 件。
#
# 依存の経路（2026-09-26 に `npm ls` で実測）:
#   packages/types -> @aws-sdk/client-bedrock-agent-runtime@3.1029.0 -> @aws-sdk/core@3.973.27
#   -> @aws-sdk/xml-builder@3.972.17 -> fast-xml-parser@5.5.8 -> fast-xml-builder@1.1.4
# 配信 web（packages/web）は packages/types に依存していない（依存は npm の @types/* だけ）。
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-5wm8-gmm8-39j9"
ignoreUntil = 2026-10-10
reason = "fast-xml-builder@1.1.4 (attribute bypass). 該当（監視のみ・攻撃面クローズ）。packages/types の @aws-sdk 経由（client-bedrock-agent-runtime <- @aws-sdk/core <- @aws-sdk/xml-builder <- fast-xml-parser）でのみ入る。2026-09-26 に npm ls で経路を実測。配信バンドル0件・直接呼び出し0件は 2026-09-23 実測。"

[[IgnoredVulns]]
id = "GHSA-gh4j-gqv2-49f6"
ignoreUntil = 2026-10-10
reason = "fast-xml-parser@5.5.8 (comment/CDATA injection). 該当（監視のみ・攻撃面クローズ）。packages/types の @aws-sdk 経由（client-bedrock-agent-runtime <- @aws-sdk/core <- @aws-sdk/xml-builder）でのみ入る。2026-09-26 に npm ls で経路を実測。配信バンドル0件・直接呼び出し0件は 2026-09-23 実測。"

